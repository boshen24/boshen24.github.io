<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bo Shen - HSR Asia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #111214;
    --ink-soft: #6b6f76;
    --line: #e6e7ea;
    --accent: #c8312c;
    --border-strong: #5b6670;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1600px; margin: 0 auto; padding: 1.6rem 1.6rem 2rem; }

  header { padding-bottom: .9rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem;
           display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:.5rem 1.5rem; }
  .header-text { flex: 1 1 auto; min-width: 260px; }
  .kicker { display:block; font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.12em;
            text-transform:uppercase; color: var(--ink-soft); margin-bottom:.35rem; }
  h1 { font-size: clamp(1.3rem, 2.4vw, 1.6rem); font-weight: 700; letter-spacing: -0.01em; margin: 0; display:inline; }
  .intro { color: var(--ink-soft); max-width: 62ch; margin: .3rem 0 0; line-height: 1.5; font-size: .86rem; }
  .backlink { flex: 0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:.75rem;
              color: var(--ink-soft); text-decoration:none; border-bottom: 1px solid var(--line); padding-bottom:.15rem; }
  .backlink:hover { color: var(--accent); border-color: var(--accent); }
  .backlink::before { content:"← "; }

  /* ---- toolbar: search + two independent layer pickers ---- */
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem 1rem; margin-bottom: .7rem; }
  .field-group { display:flex; flex-direction:column; gap:.3rem; }
  .field-label { font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color: var(--ink-soft); }
  .segmented { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .segmented button {
    font-family:"Inter",sans-serif; font-size:.74rem; background:#fff; color: var(--ink-soft);
    border:none; padding:.32rem .5rem; cursor:pointer; border-right:1px solid var(--line);
    display:inline-flex; align-items:center; gap:.3rem;
  }
  .segmented button:last-child { border-right:none; }
  .segmented button:hover { color: var(--ink); background:#f5f5f6; }
  .segmented button.active { background: var(--ink); color:#fff; }
  .btn-icon { width:14px; height:14px; flex:0 0 auto; display:block; }
  .segmented button.active .btn-icon line { stroke: #fff; }

  .search-wrap { position:relative; flex: 1 1 220px; max-width:280px; }
  .search-input {
    width:100%; font-family:"Inter",sans-serif; font-size:.82rem; padding:.42rem .7rem;
    border:1px solid var(--line); border-radius:6px; color: var(--ink); background:#fff;
  }
  .search-input:focus { outline:none; border-color: var(--accent); }
  .search-results {
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 20px rgba(0,0,0,.1);
    max-height:280px; overflow-y:auto; z-index:1000; display:none;
  }
  .search-results.open { display:block; }
  .search-result { padding:.45rem .7rem; font-size:.8rem; cursor:pointer; display:flex; justify-content:space-between; gap:.6rem; }
  .search-result:hover, .search-result.hi { background:#f5f5f6; }
  .search-result .sub { color: var(--ink-soft); font-size:.7rem; }

  /* ---- multi-select chips (currency / language) — always visible, no dropdown ---- */
  .chip-group { display:grid; gap:.3rem; }
  #currency-chips { grid-template-columns: repeat(4, 1fr); }
  #language-chips { grid-template-columns: repeat(3, 1fr); }
  .chip {
    font-family:"Inter",sans-serif; font-size:.7rem; background:#fff; color: var(--ink-soft);
    border:1px solid var(--line); border-radius:12px; padding:.24rem .5rem; cursor:pointer;
    text-align:center; white-space:nowrap;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--ink); }
  .chip.active { background: var(--ink); color:#fff; border-color: var(--ink); }

  .mapwrap { position:relative; border:1px solid var(--line); overflow:hidden;
             height: calc(100vh - 14.5rem); min-height:440px; background: var(--panel); }
  .mapdiv { position:absolute; inset:0; }
  .leaflet-container { background: var(--panel); font-family:"Inter",sans-serif; }

  .legend {
    background: #ffffff; color: var(--ink); border:1px solid var(--border-strong);
    padding:.85rem 1rem; font-size:.76rem; line-height:1.6; width:232px;
  }
  .legend h4 { margin:0 0 .55rem; font-size:.72rem; letter-spacing:.01em;
               color: var(--ink); font-weight:700; }
  .legend .note { color: var(--ink-soft); font-size:.68rem; margin-top:.5rem; line-height:1.4; }
  .legend-row { display:flex; align-items:center; gap:.5rem; margin:.15rem 0; }
  .legend-swatch { width:26px; height:3px; flex:0 0 auto; }
  .grad-bar { height:8px; margin:.3rem 0 .2rem; border:1px solid rgba(0,0,0,.15); }
  .grad-ticks { font-family:"IBM Plex Mono",monospace; font-size:.65rem; color: var(--ink-soft); }
  .grad-ends { display:flex; justify-content:space-between; font-size:.68rem; color: var(--ink-soft);
               font-style:italic; margin-top:.3rem; }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #fff; color: var(--ink); border-radius: 2px; }
  .leaflet-tooltip { background: #fff; border: 1px solid var(--border-strong); border-radius: 3px;
                      color: var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,.12); }
  .leaflet-tooltip-top:before { border-top-color: var(--border-strong); }
  .leaflet-popup-content, .leaflet-tooltip {
    font-family:"Inter",sans-serif; font-size:.82rem; line-height:1.5;
  }
  .leaflet-popup-content { margin:.7rem .85rem; min-width:200px; }
  .leaflet-tooltip { padding:.5rem .65rem; }
  .pt { font-weight:600; font-size:.9rem; margin-bottom:.3rem; }
  .pt .unit { font-weight:400; color: var(--ink-soft); font-size:.76rem; }
  .pt .local, .local { font-weight:400; color: var(--ink-soft); font-size:.78rem; }
  .row { display:flex; justify-content:space-between; gap:1rem; }
  .row .v { font-weight:600; font-family:"IBM Plex Mono",monospace; font-size:.78rem; text-align:right; }
  .meth { font-size:.68rem; color: var(--ink-soft); }
  .blk { border-top:1px solid var(--line); margin-top:.45rem; padding-top:.45rem; }
</style>
</head>
<body>
<main>
  <header>
    <div class="header-text">
      <span class="kicker">boshen24.github.io / projects</span>
      <h1>HSR Asia — Affordability Atlas</h1>
      <p class="intro">HSR affordability across eight East &amp; Southeast Asian economies.</p>
    </div>
    <a href="projects.html" class="backlink">Back to Projects</a>
  </header>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="grad-pop" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#c2d8ea"/><stop offset="1" stop-color="#4a7fad"/>
      </linearGradient>
      <linearGradient id="grad-gdp" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#c2d8ea"/><stop offset="1" stop-color="#4a7fad"/>
      </linearGradient>
      <linearGradient id="grad-density" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#e6b13a"/><stop offset="1" stop-color="#4a0820"/>
      </linearGradient>
      <linearGradient id="grad-fare" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#1a9850"/><stop offset="1" stop-color="#67001f"/>
      </linearGradient>
      <linearGradient id="grad-afford" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#0e7a38"/><stop offset="1" stop-color="#c81e24"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="toolbar">
    <div class="search-wrap">
      <div class="field-label">Search a station</div>
      <input class="search-input" id="station-search" type="text" placeholder="e.g. Guangzhounan, Tokyo…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="field-group">
      <div class="field-label">Background</div>
      <div class="segmented" id="bg-picker">
        <button data-bg="pop" class="active">
          <svg class="btn-icon" viewBox="0 0 20 20">
            <circle cx="4.5" cy="15.5" r="1.8" fill="url(#grad-pop)"/>
            <circle cx="10.5" cy="10.5" r="3" fill="url(#grad-pop)"/>
            <circle cx="16" cy="5.5" r="4.3" fill="url(#grad-pop)"/>
          </svg>
          Population density
        </button>
        <button data-bg="gdp">
          <svg class="btn-icon" viewBox="0 0 20 20">
            <rect x="2.5" y="13" width="3.6" height="5" fill="url(#grad-gdp)"/>
            <rect x="8.2" y="8.5" width="3.6" height="9.5" fill="url(#grad-gdp)"/>
            <rect x="13.9" y="2.5" width="3.6" height="15.5" fill="url(#grad-gdp)"/>
          </svg>
          GDP per capita
        </button>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Rail network</div>
      <div class="segmented" id="rail-picker">
        <button data-rail="plain" class="active">
          <svg class="btn-icon" viewBox="0 0 20 20">
            <line x1="2" y1="6.5" x2="18" y2="6.5" stroke="#3a3f45" stroke-width="1.8"/>
            <line x1="2" y1="13.5" x2="18" y2="13.5" stroke="#3a3f45" stroke-width="1.8"/>
            <line x1="4.5" y1="4" x2="4.5" y2="16" stroke="#3a3f45" stroke-width="1.4"/>
            <line x1="8.8" y1="4" x2="8.8" y2="16" stroke="#3a3f45" stroke-width="1.4"/>
            <line x1="13.1" y1="4" x2="13.1" y2="16" stroke="#3a3f45" stroke-width="1.4"/>
            <line x1="17.4" y1="4" x2="17.4" y2="16" stroke="#3a3f45" stroke-width="1.4"/>
          </svg>
          Plain
        </button>
        <button data-rail="density">
          <svg class="btn-icon" viewBox="0 0 20 20">
            <rect x="2" y="14" width="3" height="4.5" fill="url(#grad-density)"/>
            <rect x="7" y="10" width="3" height="8.5" fill="url(#grad-density)"/>
            <rect x="12" y="6" width="3" height="12.5" fill="url(#grad-density)"/>
            <rect x="17" y="1.5" width="3" height="17" fill="url(#grad-density)"/>
          </svg>
          Train pairs
        </button>
        <button data-rail="fare">
          <svg class="btn-icon" viewBox="0 0 20 20">
            <path d="M2 9 L9 2 H17.5 V10.5 L10.5 17.5 Z" fill="url(#grad-fare)"/>
            <circle cx="13.7" cy="5.8" r="1.5" fill="#fff"/>
          </svg>
          Unit fare
        </button>
        <button data-rail="afford">
          <svg class="btn-icon" viewBox="0 0 20 20">
            <text x="10" y="15.5" font-size="15" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" fill="url(#grad-afford)">%</text>
          </svg>
          Affordability
        </button>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Currency</div>
      <div class="chip-group" id="currency-chips"></div>
    </div>
    <div class="field-group">
      <div class="field-label">Language</div>
      <div class="chip-group" id="language-chips"></div>
    </div>
  </div>

  <div class="mapwrap">
    <div class="mapdiv" id="map"></div>
  </div>
</main>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/hsr-asia/hsr-asia.js"></script>
</body>
</html>
