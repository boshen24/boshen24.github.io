<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bo Shen - HSR Asia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #111214;
    --ink-soft: #6b6f76;
    --line: #e6e7ea;
    --accent: #c8312c;
    --border-strong: #5b6670;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1600px; margin: 0 auto; padding: 1.6rem 1.6rem 2rem; }

  header { padding-bottom: .9rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem;
           display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:.5rem 1.5rem; }
  .header-text { flex: 1 1 auto; min-width: 260px; }
  .kicker { display:block; font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.12em;
            text-transform:uppercase; color: var(--ink-soft); margin-bottom:.35rem; }
  h1 { font-size: clamp(1.3rem, 2.4vw, 1.6rem); font-weight: 700; letter-spacing: -0.01em; margin: 0; display:inline; }
  .intro { color: var(--ink-soft); max-width: 62ch; margin: .3rem 0 0; line-height: 1.5; font-size: .86rem; }
  .backlink { flex: 0 0 auto; font-family:"IBM Plex Mono",monospace; font-size:.75rem;
              color: var(--ink-soft); text-decoration:none; border-bottom: 1px solid var(--line); padding-bottom:.15rem; }
  .backlink:hover { color: var(--accent); border-color: var(--accent); }
  .backlink::before { content:"← "; }

  /* ---- toolbar: search + two independent layer pickers ---- */
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.9rem 1.4rem; margin-bottom: .7rem; }
  .field-group { display:flex; flex-direction:column; gap:.3rem; }
  .field-label { font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color: var(--ink-soft); }
  .segmented { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .segmented button {
    font-family:"Inter",sans-serif; font-size:.78rem; background:#fff; color: var(--ink-soft);
    border:none; padding:.4rem .7rem; cursor:pointer; border-right:1px solid var(--line);
  }
  .segmented button:last-child { border-right:none; }
  .segmented button:hover { color: var(--ink); background:#f5f5f6; }
  .segmented button.active { background: var(--ink); color:#fff; }

  .search-wrap { position:relative; flex: 1 1 220px; max-width:280px; }
  .search-input {
    width:100%; font-family:"Inter",sans-serif; font-size:.82rem; padding:.42rem .7rem;
    border:1px solid var(--line); border-radius:6px; color: var(--ink); background:#fff;
  }
  .search-input:focus { outline:none; border-color: var(--accent); }
  .search-results {
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 20px rgba(0,0,0,.1);
    max-height:280px; overflow-y:auto; z-index:1000; display:none;
  }
  .search-results.open { display:block; }
  .search-result { padding:.45rem .7rem; font-size:.8rem; cursor:pointer; display:flex; justify-content:space-between; gap:.6rem; }
  .search-result:hover, .search-result.hi { background:#f5f5f6; }
  .search-result .sub { color: var(--ink-soft); font-size:.7rem; }

  .mapwrap { position:relative; border:1px solid var(--line); overflow:hidden;
             height: calc(100vh - 14.5rem); min-height:440px; background: var(--panel); }
  .mapdiv { position:absolute; inset:0; }
  .leaflet-container { background: var(--panel); font-family:"Inter",sans-serif; }

  .legend {
    background: #ffffff; color: var(--ink); border:1.5px solid var(--border-strong);
    padding:.7rem .85rem; font-size:.76rem; line-height:1.5; max-width:220px;
  }
  .legend h4 { margin:0 0 .45rem; font-size:.72rem; letter-spacing:.01em;
               color: var(--ink); font-weight:700; }
  .legend .note { color: var(--ink-soft); font-size:.68rem; margin-top:.5rem; line-height:1.4; }
  .legend-row { display:flex; align-items:center; gap:.5rem; margin:.15rem 0; }
  .legend-swatch { width:26px; height:3px; flex:0 0 auto; }
  .grad-bar { height:8px; margin:.3rem 0 .2rem; border:1px solid rgba(0,0,0,.15); }
  .grad-ticks { font-family:"IBM Plex Mono",monospace; font-size:.65rem; color: var(--ink-soft); }
  .grad-ends { display:flex; justify-content:space-between; font-size:.68rem; color: var(--ink-soft);
               font-style:italic; margin-top:.3rem; }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #fff; color: var(--ink); border-radius: 2px; }
  .leaflet-popup-content { font-family:"Inter",sans-serif; font-size:.82rem; line-height:1.5; margin:.7rem .85rem; min-width:200px; }
  .leaflet-popup-content .pt { font-weight:600; font-size:.9rem; margin-bottom:.25rem; }
  .leaflet-popup-content .pt .local { font-weight:400; color: var(--ink-soft); font-size:.78rem; }
  .leaflet-popup-content .row { display:flex; justify-content:space-between; gap:1rem; }
  .leaflet-popup-content .row .v { font-weight:600; font-family:"IBM Plex Mono",monospace; font-size:.78rem; }
  .leaflet-popup-content .meth { font-size:.68rem; color: var(--ink-soft); }
  .leaflet-popup-content .blk { border-top:1px solid var(--line); margin-top:.45rem; padding-top:.45rem; }
</style>
</head>
<body>
<main>
  <header>
    <div class="header-text">
      <span class="kicker">boshen24.github.io / projects</span>
      <h1>HSR Asia — Affordability Atlas</h1>
      <p class="intro">High-speed rail affordability across eight East &amp; Southeast Asian economies — service
        density, fare per kilometre, and fare-to-income affordability, mapped network-wide.</p>
    </div>
    <a href="projects.html" class="backlink">Back to Projects</a>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <div class="field-label">Search a station</div>
      <input class="search-input" id="station-search" type="text" placeholder="e.g. Guangzhou South, Tokyo…" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="field-group">
      <div class="field-label">Background</div>
      <div class="segmented" id="bg-picker">
        <button data-bg="pop" class="active">Population density</button>
        <button data-bg="gdp">GDP per capita</button>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Rail network</div>
      <div class="segmented" id="rail-picker">
        <button data-rail="plain" class="active">Plain</button>
        <button data-rail="density">Service density</button>
        <button data-rail="fare">Fare / km</button>
        <button data-rail="afford">Affordability</button>
      </div>
    </div>
  </div>

  <div class="mapwrap">
    <div class="mapdiv" id="map"></div>
  </div>
</main>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/hsr-asia/hsr-asia.js"></script>
</body>
</html>
